[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qst"
version = "1.0.0"
description = "A modular quantum-security simulation and research toolkit for modeling BB84 Quantum Key Distribution, Eve eavesdropping dynamics, Cascade error correction, and 2-universal privacy amplification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "QST Authors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "quantum-cryptography",
    "qkd",
    "bb84",
    "cascade-protocol",
    "privacy-amplification",
    "qiskit",
]
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/shlok926/Project-Q-30-Days-Challenge"
Repository = "https://github.com/shlok926/Project-Q-30-Days-Challenge"
Documentation = "https://github.com/shlok926/Project-Q-30-Days-Challenge/tree/main/Mini_Project_3/Quantum%20Security%20Toolkit%20(QST)/Docs"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
]

[project.scripts]
qst = "qst.cli.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "D",   # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "E501", # Line too long
]

[tool.ruff.lint.mccabe]
max-complexity = 35

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "C901"]


[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_ibm_runtime.*",
    "matplotlib.*",
    "hypothesis.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=qst --cov-report=term-missing --cov-report=xml"
testpaths = [
    "tests",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
    "performance: performance tests",
    "e2e: end-to-end tests",
]

